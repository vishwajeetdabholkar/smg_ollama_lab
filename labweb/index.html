<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMG + Ollama Lab</title>
<style>
:root{
  --bg:#0a0d13; --nav:#0c1018; --panel:#11161f; --panel2:#151b27; --line:#212a3a; --line2:#2a3550;
  --text:#e6e9ef; --muted:#8e97aa; --dim:#5f687c;
  --accent:#7aa2ff; --green:#4ade80; --red:#f87171; --amber:#fbbf24; --violet:#c084fc; --cyan:#22d3ee; --pink:#f472b6;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.62 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--mono);font-size:.86em;background:#18202f;border:1px solid #232d42;padding:1px 5px;border-radius:5px;color:#cbd6ff;white-space:break-spaces}
a.file{cursor:pointer}
a.file code{border-color:#34508a;color:#a9c4ff}
a.file:hover code{background:#1d2a45}
strong{color:#fff}
h1,h2,h3{line-height:1.25}
button{font:inherit;color:inherit}

.app{display:grid;grid-template-columns:236px minmax(0,1fr) 388px;height:100vh}
nav{background:var(--nav);border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
main{overflow:auto;scroll-behavior:smooth}
aside{background:var(--nav);border-left:1px solid var(--line);overflow:auto;padding:14px 14px 40px}

.brand{padding:18px 16px 12px;display:flex;gap:10px;align-items:center}
.logo{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 200deg,#7aa2ff,#c084fc,#22d3ee,#7aa2ff);display:grid;place-items:center;font:800 12px var(--mono);color:#0a0d13}
.brand b{display:block;font-size:13.5px}
.brand span{font-size:11.5px;color:var(--muted)}
.overall{margin:4px 16px 12px;height:5px;border-radius:9px;background:#1a2130;overflow:hidden}
.overall i{display:block;height:100%;background:linear-gradient(90deg,#7aa2ff,#4ade80);width:0;transition:width .5s}
.overall-l{margin:0 16px 10px;font-size:11.5px;color:var(--muted)}
.navlist{padding:4px 8px;flex:1}
.navitem{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:13.2px;line-height:1.3;user-select:none}
.navitem:hover{background:#121826;color:var(--text)}
.navitem.active{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.navitem .num{font:600 11px var(--mono);color:var(--dim);width:16px;text-align:right}
.navitem.active .num{color:var(--accent)}
.navsep{margin:12px 12px 6px;font:600 10.5px var(--mono);letter-spacing:.09em;color:var(--dim);text-transform:uppercase}
.navfoot{padding:10px 14px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}

.page{max-width:900px;margin:0 auto;padding:34px 40px 180px}
.crumbs{font:600 11.5px var(--mono);letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.page h1{font-size:30px;margin:6px 0 8px;letter-spacing:-.01em}
.goal{font-size:16.5px;color:#c9cfdb;margin:0 0 18px}
.page p{margin:10px 0}
.page ul,.page ol{padding-left:22px}
.page li{margin:4px 0}
.page h3{font-size:16px;margin:22px 0 8px}
table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}

.why{display:grid;grid-template-columns:1fr;gap:12px;background:linear-gradient(135deg,rgba(122,162,255,.09),rgba(192,132,252,.06));border:1px solid #27335a;border-radius:16px;padding:16px 18px;margin:16px 0 8px}
.why h4{margin:0;font:700 11.5px var(--mono);letter-spacing:.09em;color:#a9bfff;text-transform:uppercase}
.why p{margin:0;color:#d7dceb}
.terms{display:flex;flex-wrap:wrap;gap:8px}
.term-chip{position:relative;font-size:12.5px;padding:4px 10px;border-radius:999px;background:#151d30;border:1px solid #2b3a63;color:#c3d1ff;cursor:help}
.term-chip .tip{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:280px;padding:10px 12px;border-radius:10px;background:#0d121c;border:1px solid var(--line2);color:var(--text);font-size:12.5px;line-height:1.5;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.term-chip:hover .tip,.term-chip:focus .tip{display:block}

.loopbar{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 4px;position:sticky;top:0;z-index:5;padding:10px 0;background:linear-gradient(var(--bg) 75%,transparent)}
.loopbar a{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.loopbar a:hover{color:var(--text);text-decoration:none;border-color:var(--line2)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:18px 0;scroll-margin-top:56px;position:relative}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--kc,var(--line2))}
.card>.hd{display:flex;align-items:center;gap:10px;padding:13px 18px 4px 20px}
.card>.hd b{font-size:15px}
.card>.bd{padding:4px 20px 16px 20px}
.chip{font:700 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:color-mix(in srgb,var(--kc) 16%,transparent);color:var(--kc)}
.k-prep{--kc:#8e97aa}.k-predict{--kc:var(--violet)}.k-do{--kc:var(--accent)}.k-observe{--kc:var(--cyan)}
.k-explain{--kc:var(--amber)}.k-challenge{--kc:var(--pink)}.k-wrap{--kc:var(--red)}.k-check{--kc:var(--green)}
.lead{font-size:15px;color:#dfe4ee}

.cmd{border:1px solid #1f283a;border-radius:12px;background:#080b11;margin:12px 0;overflow:hidden}
.cmdrow{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 10px 9px 10px;border-top:1px solid #141a27;transition:background .2s}
.cmdrow:first-child{border-top:0}
.cmdrow:hover{background:#0b0f18}
.cmdrow.ran{background:rgba(74,222,128,.035)}
.cmdrow.ran pre.sh{opacity:.62}
.tchip{font:700 10.5px/1 var(--mono);padding:5px 0;border-radius:6px;background:#16203a;color:#a3b9ff;text-align:center;margin-top:1px;cursor:help}
.tchip.fg{background:#2b2111;color:var(--amber)}
.tchip.all{background:#1c1730;color:var(--violet)}
pre.sh{margin:0;font:12.6px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;color:#dde3f0}
.sh .c{color:#7dd3fc;font-weight:600}.sh .f{color:#c4b5fd}.sh .s{color:#86efac}.sh .cm{color:#5f687c;font-style:italic}.sh .hd{color:#c9cfdb}
.tools{display:flex;gap:6px;align-items:center}
.ico{border:1px solid #263047;background:#111827;border-radius:7px;padding:3px 8px;cursor:pointer;font-size:12px;color:#c9d2e6}
.ico:hover{border-color:#3d4f7a;color:#fff}
.ico.ok{border-color:#2f6a46;color:var(--green)}
.tick{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none}
.tick input{accent-color:#4ade80;margin:0;cursor:pointer}
.fgnote{grid-column:2/4;font-size:11.5px;color:#c99a3a;margin-top:-4px}
.cmtrow{padding:7px 12px 0 58px;color:var(--dim);font:12px/1.5 var(--mono)}
.expect{margin:0 10px 10px 58px;border:1px dashed #263350;border-radius:10px;background:#0b1019}
.expect summary{cursor:pointer;padding:6px 10px;font:600 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:#7f8fb8;list-style:none}
.expect summary::before{content:"▸ ";}
.expect[open] summary::before{content:"▾ ";}
.expect .ebody{padding:0 12px 10px;font-size:13px;color:#cfd6e4}
.expect .ebody p{margin:4px 0}
pre.out{margin:4px 0 6px;padding:8px 10px;background:#05070b;border:1px solid #182033;border-radius:8px;font:12px/1.5 var(--mono);color:#b7f7c9;white-space:pre-wrap;word-break:break-word}
pre.code{background:#080b11;border:1px solid #1f283a;border-radius:12px;padding:12px 14px;font:12.5px/1.55 var(--mono);overflow:auto;white-space:pre}

.callout{border-radius:12px;padding:11px 14px 11px 42px;margin:12px 0;position:relative;font-size:14px}
.callout::before{position:absolute;left:14px;top:10px;font:700 14px var(--mono)}
.callout p{margin:0}
.callout.stop{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3)}
.callout.stop::before{content:"■";color:var(--red)}
.callout.tip{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.28)}
.callout.tip::before{content:"!";color:var(--amber)}
.callout.ok{background:rgba(74,222,128,.07);border:1px solid rgba(74,222,128,.28)}
.callout.ok::before{content:"✓";color:var(--green)}

textarea.note{width:100%;min-height:74px;margin-top:10px;background:#090c12;border:1px solid #263049;border-radius:10px;color:var(--text);padding:10px 12px;font:13.5px/1.55 -apple-system,BlinkMacSystemFont,sans-serif;resize:vertical;outline:none}
textarea.note:focus{border-color:#4a63a8;box-shadow:0 0 0 3px rgba(122,162,255,.12)}
textarea.note::placeholder{color:#4f586b}
.saved{font-size:11px;color:var(--dim);margin-top:4px;height:14px}

.q{border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;margin:12px 0;background:var(--panel2)}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qn{font:700 11px var(--mono);color:var(--amber);background:rgba(251,191,36,.12);border-radius:6px;padding:4px 7px;margin-top:2px}
.qt{flex:1}
.qt p{margin:0}
.btn{border:1px solid var(--line2);background:#141b2a;border-radius:9px;padding:6px 12px;cursor:pointer;font-size:13px;color:#d3dbec}
.btn:hover{border-color:#40548a;color:#fff}
.btn.primary{background:linear-gradient(135deg,#3b5bd6,#6c4fd6);border-color:transparent;color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.small{padding:3px 9px;font-size:12px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:wait}
.reveal-row{margin-top:10px;display:flex;gap:10px;align-items:center}
.answer{display:none;margin-top:10px;padding:12px 14px;border-radius:10px;background:rgba(251,191,36,.05);border:1px solid rgba(251,191,36,.22);font-size:14px}
.answer.show{display:block;animation:fade .25s}
.answer p{margin:6px 0}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1}}

pre.checkout{white-space:pre-wrap;background:#05070b;border:1px solid #182033;border-radius:10px;padding:10px 12px;font:12.5px/1.55 var(--mono);margin:12px 0 0;display:none}
pre.checkout.show{display:block}
pre.checkout.pass{border-color:#2f6a46;color:#bff5cf}
pre.checkout.fail{border-color:#6a2f2f;color:#ffc9c9}
.pager{display:flex;justify-content:space-between;margin-top:30px;gap:12px}
.pager .btn{padding:10px 16px}

.hero{border-radius:20px;padding:28px 28px 22px;background:radial-gradient(1200px 300px at 0% 0%,rgba(122,162,255,.18),transparent),radial-gradient(800px 300px at 100% 0%,rgba(192,132,252,.14),transparent),var(--panel);border:1px solid #273150}
.hero h1{margin:0 0 6px;font-size:34px}
.hero p{color:#cdd3df;font-size:15.5px}
.loopsteps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0 6px}
.loopsteps div{border-radius:12px;padding:10px 10px;background:#0d121c;border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.loopsteps b{display:block;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.terms4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.tbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#0b0f17;font-size:13px}
.tbox b{font:700 12px var(--mono)}
.tbox .tt{display:inline-block;font:700 10.5px var(--mono);padding:3px 6px;border-radius:5px;margin-right:6px}
.taskgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.tcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel);cursor:pointer;transition:border-color .2s, transform .2s}
.tcard:hover{border-color:#3a4b78;transform:translateY(-1px)}
.tcard .n{font:700 11px var(--mono);color:var(--accent)}
.tcard b{display:block;margin:2px 0 4px}
.tcard span{font-size:12.5px;color:var(--muted)}
.tcard.done{border-color:#2f6a46}
.tcard.done .n::after{content:"  ✓ done";color:var(--green)}

/* aside */
.reel{border-radius:22px;background:#05070c;border:1px solid #232b3d;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45);position:relative}
.reel-bars{display:flex;gap:4px;padding:10px 12px 0}
.reel-bars div{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;cursor:pointer}
.reel-bars div i{display:block;height:100%;width:0;background:#fff}
.reel-title{padding:8px 14px 0;font:700 12px var(--mono);letter-spacing:.06em;color:#c9d4f5;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.reel-title span{color:var(--dim);font-weight:600}
.reel canvas{display:block;width:100%}
.reel-cap{min-height:74px;padding:4px 16px 12px;font-size:14px;line-height:1.45;color:#e9edf6}
.reel-cap b{color:#ffd76a;font-weight:700}
.reel-ctl{display:flex;gap:6px;justify-content:center;padding:0 0 12px}
.reel-ctl button{border:1px solid #263047;background:#0f1522;border-radius:8px;padding:3px 12px;cursor:pointer;color:#c9d2e6;font-size:13px}
.reel-ctl button:hover{border-color:#3d4f7a}
.tabs{display:flex;gap:4px;margin:16px 0 10px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:8px 10px;cursor:pointer;color:var(--muted);font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs button .badge{font:700 10px var(--mono);padding:1px 5px;border-radius:5px;background:#3a1f1f;color:#ffb4b4;margin-left:4px}
.comp{display:grid;grid-template-columns:10px 76px 50px 1fr;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid #151b28;font-size:12.5px}
.comp b{font:600 12px var(--mono)}
.comp .port{font:12px var(--mono);color:var(--dim)}
.comp .st{color:var(--muted);font-size:12px;text-align:right}
.dot{width:9px;height:9px;border-radius:50%;background:#333c50}
.dot.ok{background:var(--green);box-shadow:0 0 8px rgba(74,222,128,.6)}
.dot.manual{background:var(--accent);box-shadow:0 0 8px rgba(122,162,255,.6)}
.dot.warn{background:var(--amber)}
.hint{font-size:12px;color:#e7c27a;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.22);border-radius:9px;padding:7px 9px;margin:6px 0}
.hint code{font-size:11px}
.small{font-size:12px;color:var(--muted)}
.wk{font:12px var(--mono);padding:6px 4px;border-bottom:1px solid #151b28;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wk em{font-style:normal;color:var(--dim)}
.envchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.envchips span{font:11px var(--mono);padding:2px 7px;border-radius:6px;background:#121a2a;border:1px solid #222c43;color:#b7c4e6}
.sect{font:700 10.5px var(--mono);letter-spacing:.09em;color:var(--dim);text-transform:uppercase;margin:16px 0 6px}
.chart{background:#0b0f17;border:1px solid var(--line);border-radius:12px;padding:8px 8px 4px;margin:8px 0}
.chart h5{margin:2px 4px 4px;font:600 11.5px var(--mono);color:#b9c4dd}
.rtable{width:100%;font:11px var(--mono);border-collapse:collapse}
.rtable th,.rtable td{padding:4px 5px;border-bottom:1px solid #161d2b;text-align:right;white-space:nowrap}
.rtable th:first-child,.rtable td:first-child{text-align:left}
.legend{display:flex;gap:10px;flex-wrap:wrap;font:11px var(--mono);color:var(--muted);padding:0 4px 4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.kv{font:12px var(--mono);display:grid;grid-template-columns:140px 1fr;gap:3px 10px;padding:4px}
.kv span:nth-child(odd){color:var(--dim)}

.drawer{position:fixed;inset:0 0 0 auto;width:min(760px,96vw);background:#0b0f17;border-left:1px solid var(--line2);box-shadow:-20px 0 60px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .25s;z-index:50;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font:600 13px var(--mono)}
.drawer .db{overflow:auto;padding:10px 26px 60px}
.drawer pre.code{white-space:pre-wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;transition:all .25s;background:#141c2c;border:1px solid var(--line2);padding:9px 16px;border-radius:10px;font-size:13px;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.offline{max-width:640px;margin:12vh auto;padding:24px;border:1px solid var(--line2);border-radius:16px;background:var(--panel)}
.fab{display:none;position:fixed;right:16px;bottom:16px;z-index:40;border-radius:999px;padding:10px 16px;background:linear-gradient(135deg,#3b5bd6,#6c4fd6);border:0;color:#fff;font-weight:600;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.menu{display:none}

@media (max-width:1240px){
  .app{grid-template-columns:220px minmax(0,1fr)}
  aside{position:fixed;right:0;top:0;bottom:0;width:390px;z-index:45;transform:translateX(100%);transition:transform .25s;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
  aside.open{transform:none}
  .fab{display:block}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:46;transform:translateX(-100%);transition:transform .25s}
  nav.open{transform:none}
  .menu{display:block;position:fixed;left:12px;top:12px;z-index:40}
  .page{padding:56px 18px 160px}
  .loopsteps,.taskgrid,.terms4{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <main id="main"><div class="page" id="page"></div></main>
  <aside id="aside">
    <div id="reelhost"></div>
    <div class="tabs" id="tabs">
      <button data-tab="live" class="on">Live</button>
      <button data-tab="results">Results</button>
      <button data-tab="notes">Notes</button>
    </div>
    <div id="tab-live"></div>
    <div id="tab-results" hidden></div>
    <div id="tab-notes" hidden></div>
  </aside>
</div>
<button class="btn menu" id="menuBtn">☰ Tasks</button>
<button class="fab" id="fab">Reel &amp; live status</button>
<div class="drawer" id="drawer"><div class="dh"><span id="drawerTitle"></span><button class="btn small" data-act="closedrawer">Close ✕</button></div><div class="db" id="drawerBody"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================ utilities */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const store = {
  get(k, d) { try { const v = localStorage.getItem("smglab:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { localStorage.setItem("smglab:" + k, JSON.stringify(v)); },
  del(k) { localStorage.removeItem("smglab:" + k); },
  keys() { return Object.keys(localStorage).filter(k => k.startsWith("smglab:")).map(k => k.slice(7)); },
};
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1800); }
async function api(path, opts) { const r = await fetch(path, opts); if (!r.ok) throw new Error(path + " " + r.status); return r.json(); }

/* ============================================================ markdown */
const FENCE = /^(\s*)```\s*([\w-]*)\s*$/;
const LISTM = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;

    this.cv = host.querySelector("canvas"); this.cap = host.querySelector(".reel-cap"); this.bars = [...host.querySelectorAll(".reel-bars i")];
    const dpr = Math.min(2, window.devicePixelRatio || 1); this.cv.width = RW * dpr; this.cv.height = RH * dpr; this.cv.style.aspectRatio = `${RW}/${RH}`;
    this.ctx = this.cv.getContext("2d"); this.ctx.scale(dpr, dpr);
    this.playing = true; this.alive = true;
    host.querySelector(".reel-bars").onclick = e => { const d = e.target.closest("[data-i]"); if (d) this.go(+d.dataset.i); };
    host.querySelector(".reel-ctl").onclick = e => {
      const a = e.target.dataset.a; if (!a) return;
      if (a === "play") { this.playing = !this.playing; e.target.textContent = this.playing ? "❚❚" : "▶"; }
      if (a === "prev") this.go(this.i - 1);
      if (a === "next") this.go(this.i + 1);
    };
    this.go(0); this.last = performance.now();
    const frame = ts => { if (!this.alive) return; this.tick(ts); requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
  }
  go(i) {
    const n = this.def.scenes.length; this.i = ((i % n) + n) % n;
    this.sc = this.def.scenes[this.i]; this.w = new World(this.def);
    if (this.def.base) this.def.base(this.w);
    this.sc.setup && this.sc.setup(this.w);
    this.cap.innerHTML = esc(this.sc.cap).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
    this.bars.forEach((b, k) => b.style.width = k < this.i ? "100%" : "0");
  }
  tick(ts) {
    let dt = Math.min(0.05, (ts - this.last) / 1000); this.last = ts;
    if (!this.playing || document.hidden) dt = 0;
    if (dt) { const sub = 2; for (let k = 0; k < sub; k++) this.w.step(dt / sub); }
    const p = Math.min(1, this.w.t / this.sc.dur);
    drawWorld(this.ctx, this.w, this.sc, p);
    this.bars[this.i].style.width = (p * 100) + "%";
    if (this.w.t >= this.sc.dur) this.go(this.i + 1);
  }
  destroy() { this.alive = false; }
}

function svgBars(title, cats, series, fmt = v => v) {

}

      if (out) { out.textContent = r.output; out.className = `checkout show ${r.passed ? "pass" : "fail"}`; }
      if (r.passed) { store.set(`done:${n}`, true); toast(`Task ${n} done ✓`); } else toast(r.output.split("\n")[0]);
      renderNav();
    } catch { toast("Couldn't reach the lab companion server"); }
    act.disabled = false; act.textContent = old;
  }
  if (a === "export") exportNotes();
  if (a === "reset" && confirm("Clear all ticks, notes and check results saved in this browser?")) { store.keys().forEach(k => store.del(k)); S.cur = null; route(); }
  if (a === "closedrawer") $("#drawer").classList.remove("open");
});
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.key; if (!k) return;
  store.set(k, e.target.value);
  const s = document.querySelector(`[data-saved="${CSS.escape(k)}"]`); if (s) { s.textContent = "saved"; clearTimeout(s._h); s._h = setTimeout(() => s.textContent = "", 1000); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#drawer").classList.remove("open"); });
$("#fab").onclick = () => $("#aside").classList.toggle("open");
$("#menuBtn").onclick = () => $("#nav").classList.toggle("open");

/* ============================================================ boot */
(async function boot() {
  const cap = new URLSearchParams(location.search).get("capture");
  if (cap !== null) {
    // Recording mode for labweb/record_reels.py: one reel, time driven by window.__advance(seconds).
    document.body.innerHTML = `<div id="cap" style="width:360px;padding:10px"></div>`;
    document.body.style.cssText = "background:#0b0f17;margin:0;overflow:hidden";
    const def = REELS[+cap] || REELS[0], r = new Reel($("#cap"), def);
    $("#cap .reel-ctl").remove(); $("#cap .reel").style.boxShadow = "none";
    r.alive = false; r.go(0); let ts = 0; r.last = 0;
    window.__total = def.scenes.reduce((s, sc) => s + sc.dur, 0);
    window.__advance = sec => { for (let k = 0; k < Math.round(sec * 60); k++) { ts += 1000 / 60; r.tick(ts); } };
    window.__advance(0.02);
    return;
  }
  try {
    const g = await api("/api/guide");
    S.models = g.models || {};
    S.guide = parseGuide(g.guide); S.tasks = S.guide.tasks; S.answers = parseAnswers(g.answers);
  } catch {
    document.body.innerHTML = `<div class="offline"><h2>Start the lab companion</h2><p>This page reads the lab files through a tiny local server. In the lab folder, run:</p><pre class="code">python3 labweb/server.py</pre><p>It opens <a href="http://127.0.0.1:8090">http://127.0.0.1:8090</a>. It uses only Python's standard library.</p></div>`;
    return;
  }
  window.addEventListener("hashchange", route);
  route(); pollStatus(); pollResults();
  setInterval(pollStatus, 3000); setInterval(pollResults, 8000);
})();
</script>
